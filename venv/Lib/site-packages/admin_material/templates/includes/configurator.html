<style>
/* ESTILOS CRÍTICOS - Se aplican inmediatamente */
:root {
  --persistent-sidebar-color: dark;
  --persistent-sidebar-type: bg-white;
  --persistent-navbar-fixed: false;
  --persistent-dark-mode: false;
}

/* Aplicar estilos inmediatamente basados en las variables CSS */
.sidenav {
  background-color: transparent;
}

/* Sidebar Colors - Aplicación inmediata */
.sidenav.bg-gradient-primary { background: linear-gradient(195deg, #ec407a, #d81b60) !important; }
.sidenav.bg-gradient-dark { background: linear-gradient(195deg, #42424a, #191919) !important; }
.sidenav.bg-gradient-info { background: linear-gradient(195deg, #49a3f1, #1A73E8) !important; }
.sidenav.bg-gradient-success { background: linear-gradient(195deg, #66BB6A, #43A047) !important; }
.sidenav.bg-gradient-warning { background: linear-gradient(195deg, #FFA726, #FB8C00) !important; }
.sidenav.bg-gradient-danger { background: linear-gradient(195deg, #EF5350, #E53935) !important; }

/* Sidebar Types - Aplicación inmediata */
.sidenav.bg-transparent { background: transparent !important; }
.sidenav.bg-white { background: #fff !important; }

/* Dark Mode - Aplicación inmediata */
body.dark-version {
  background-color: #1a1a1a !important;
  color: #fff !important;
}

body.white-version {
  background-color: #f8f9fa !important;
  color: #344767 !important;
}

/* Navbar Fixed - Aplicación inmediata */
.navbar-main.fixed-top {
  position: fixed !important;
  top: 0 !important;
  width: 100% !important;
  z-index: 1030 !important;
}

body.has-fixed-navbar {
  padding-top: 64px !important;
}
</style>

<div class="fixed-plugin">
    <a class="fixed-plugin-button text-dark position-fixed px-3 py-2">
      <i class="material-symbols-rounded py-2">settings</i>
    </a>
    <div class="card shadow-lg">
      <div class="card-header pb-0 pt-3">
        <div class="float-start">
          <h5 class="mt-3 mb-0">Material UI Configurator</h5>
          <p>See our dashboard options.</p>
        </div>
        <div class="float-end mt-4">
          <button class="btn btn-link text-dark p-0 fixed-plugin-close-button">
            <i class="material-symbols-rounded">clear</i>
          </button>
        </div>
        <!-- End Toggle Button -->
      </div>
      <hr class="horizontal dark my-1">
      <div class="card-body pt-sm-3 pt-0">
        <!-- Sidebar Backgrounds -->
        <div>
          <h6 class="mb-0">Sidebar Colors</h6>
        </div>
        <a href="javascript:void(0)" class="switch-trigger background-color">
          <div class="badge-colors my-2 text-start">
            <span class="badge filter bg-gradient-primary" data-color="primary" onclick="persistentSidebarColor(this)"></span>
            <span class="badge filter bg-gradient-dark active" data-color="dark" onclick="persistentSidebarColor(this)"></span>
            <span class="badge filter bg-gradient-info" data-color="info" onclick="persistentSidebarColor(this)"></span>
            <span class="badge filter bg-gradient-success" data-color="success" onclick="persistentSidebarColor(this)"></span>
            <span class="badge filter bg-gradient-warning" data-color="warning" onclick="persistentSidebarColor(this)"></span>
            <span class="badge filter bg-gradient-danger" data-color="danger" onclick="persistentSidebarColor(this)"></span>
          </div>
        </a>
        <!-- Sidenav Type -->
        <div class="mt-3">
          <h6 class="mb-0">Sidenav Type</h6>
          <p class="text-sm">Choose between different sidenav types.</p>
        </div>
        <div class="d-flex">
          <button class="btn bg-gradient-dark px-3 mb-2" data-class="bg-gradient-dark" onclick="persistentSidebarType(this)">Dark</button>
          <button class="btn bg-gradient-dark px-3 mb-2 ms-2" data-class="bg-transparent" onclick="persistentSidebarType(this)">Transparent</button>
          <button class="btn bg-gradient-dark px-3 mb-2 active ms-2" data-class="bg-white" onclick="persistentSidebarType(this)">White</button>
        </div>
        <p class="text-sm d-xl-none d-block mt-2">You can change the sidenav type just on desktop view.</p>
        <!-- Navbar Fixed -->
        <div class="mt-3 d-flex">
          <h6 class="mb-0">Navbar Fixed</h6>
          <div class="form-check form-switch ps-0 ms-auto my-auto">
            <input class="form-check-input mt-1 ms-auto" type="checkbox" id="navbarFixed" onclick="persistentNavbarFixed(this)">
          </div>
        </div>
        <hr class="horizontal dark my-3">
        <div class="mt-2 d-flex">
          <h6 class="mb-0">Light / Dark</h6>
          <div class="form-check form-switch ps-0 ms-auto my-auto">
            <input class="form-check-input mt-1 ms-auto" type="checkbox" id="dark-version" onclick="persistentDarkMode(this)">
          </div>
        </div>
        <hr class="horizontal dark my-3">
        <div class="mt-2">
          <button class="btn bg-gradient-danger w-100" onclick="resetSettings()">Reset to Default</button>
        </div>
      </div>
    </div>
</div>

<script>
// ===== CONFIGURACIÓN PERSISTENTE MEJORADA - SIN FLASH =====

// Aplicar configuraciones INMEDIATAMENTE (antes de DOMContentLoaded)
(function() {
    'use strict';
    
    console.log('🚀 Aplicando configuraciones persistentes inmediatamente...');
    
    // Cargar configuraciones del localStorage
    const settings = {
        sidebarColor: localStorage.getItem('persistentSidebarColor') || 'dark',
        sidebarType: localStorage.getItem('persistentSidebarType') || 'bg-white',
        navbarFixed: localStorage.getItem('persistentNavbarFixed') === 'true',
        darkMode: localStorage.getItem('persistentDarkMode') === 'true'
    };
    
    // Aplicar configuraciones CRÍTICAS inmediatamente
    applyCriticalSettings(settings);
    
    // Guardar settings para uso posterior
    window.persistentSettings = settings;
})();

// Función para aplicar configuraciones críticas inmediatamente
function applyCriticalSettings(settings) {
    // Aplicar color del sidebar inmediatamente
    const sidebar = document.querySelector('.sidenav');
    if (sidebar) {
        // Limpiar clases de color existentes
        const colorClasses = ['bg-gradient-primary', 'bg-gradient-dark', 'bg-gradient-info', 
                            'bg-gradient-success', 'bg-gradient-warning', 'bg-gradient-danger'];
        colorClasses.forEach(cls => sidebar.classList.remove(cls));
        
        // Aplicar nuevo color
        sidebar.classList.add('bg-gradient-' + settings.sidebarColor);
        
        // Limpiar y aplicar tipo de sidebar
        sidebar.classList.remove('bg-transparent', 'bg-white');
        sidebar.classList.add(settings.sidebarType);
    }
    
    // Aplicar modo oscuro/claro inmediatamente
    const body = document.body;
    if (settings.darkMode) {
        body.classList.add('dark-version');
        body.classList.remove('white-version');
    } else {
        body.classList.add('white-version');
        body.classList.remove('dark-version');
    }
    
    // Aplicar navbar fixed inmediatamente
    if (settings.navbarFixed) {
        const navbar = document.querySelector('.navbar-main');
        if (navbar) {
            navbar.classList.add('fixed-top');
            body.classList.add('has-fixed-navbar');
        }
    }
}

// Inicializar cuando el DOM esté listo (para UI del configurador)
document.addEventListener('DOMContentLoaded', function() {
    initializePersistentSettings();
    setupConfiguratorToggle();
});

// Configuración por defecto
const defaultSettings = {
    sidebarColor: 'dark',
    sidebarType: 'bg-white',
    navbarFixed: false,
    darkMode: false
};

// Inicializar configuraciones persistentes (completa)
function initializePersistentSettings() {
    console.log('🔄 Completando inicialización de configuraciones...');
    
    const settings = window.persistentSettings || {
        sidebarColor: localStorage.getItem('persistentSidebarColor') || defaultSettings.sidebarColor,
        sidebarType: localStorage.getItem('persistentSidebarType') || defaultSettings.sidebarType,
        navbarFixed: localStorage.getItem('persistentNavbarFixed') === 'true',
        darkMode: localStorage.getItem('persistentDarkMode') === 'true'
    };
    
    // Actualizar UI del configurador
    updateConfiguratorUI(settings);
    
    console.log('✅ Configuración completa aplicada:', settings);
}

// Configurar toggle del configurador
function setupConfiguratorToggle() {
    const fixedPluginButton = document.querySelector('.fixed-plugin-button');
    const fixedPluginClose = document.querySelector('.fixed-plugin-close-button');
    const fixedPluginCard = document.querySelector('.fixed-plugin .card');
    
    if (fixedPluginButton && fixedPluginCard) {
        fixedPluginButton.addEventListener('click', function() {
            fixedPluginCard.classList.toggle('show');
        });
        
        if (fixedPluginClose) {
            fixedPluginClose.addEventListener('click', function() {
                fixedPluginCard.classList.remove('show');
            });
        }
        
        // Cerrar al hacer click fuera
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.fixed-plugin') && fixedPluginCard.classList.contains('show')) {
                fixedPluginCard.classList.remove('show');
            }
        });
    }
}

// ===== FUNCIONES PERSISTENTES =====

// Color del sidebar persistente
function persistentSidebarColor(element) {
    const color = element.getAttribute('data-color');
    console.log('🎨 Cambiando color del sidebar a:', color);
    
    applyPersistentSidebarColor(color);
    localStorage.setItem('persistentSidebarColor', color);
    updateActiveColorButton(color);
}

function applyPersistentSidebarColor(color) {
    const sidebar = document.querySelector('.sidenav');
    if (sidebar) {
        // Remover todas las clases de color
        const colorClasses = ['bg-gradient-primary', 'bg-gradient-dark', 'bg-gradient-info', 
                            'bg-gradient-success', 'bg-gradient-warning', 'bg-gradient-danger'];
        colorClasses.forEach(cls => sidebar.classList.remove(cls));
        
        // Aplicar nuevo color
        sidebar.classList.add('bg-gradient-' + color);
    }
}

// Tipo de sidebar persistente
function persistentSidebarType(element) {
    const sidebarClass = element.getAttribute('data-class');
    console.log('📁 Cambiando tipo de sidebar a:', sidebarClass);
    
    applyPersistentSidebarType(sidebarClass);
    localStorage.setItem('persistentSidebarType', sidebarClass);
    updateActiveTypeButton(sidebarClass);
}

function applyPersistentSidebarType(sidebarClass) {
    const sidebar = document.querySelector('.sidenav');
    if (sidebar) {
        // Remover clases de tipo
        sidebar.classList.remove('bg-gradient-dark', 'bg-transparent', 'bg-white');
        // Aplicar nuevo tipo
        sidebar.classList.add(sidebarClass);
    }
}

// Navbar fixed persistente
function persistentNavbarFixed(element) {
    const isFixed = element.checked;
    console.log('📌 Navbar fixed:', isFixed);
    
    applyPersistentNavbarFixed(isFixed);
    localStorage.setItem('persistentNavbarFixed', isFixed);
}

function applyPersistentNavbarFixed(isFixed) {
    const navbar = document.querySelector('.navbar-main');
    const body = document.body;
    if (navbar) {
        if (isFixed) {
            navbar.classList.add('fixed-top');
            body.classList.add('has-fixed-navbar');
            document.body.style.paddingTop = navbar.offsetHeight + 'px';
        } else {
            navbar.classList.remove('fixed-top');
            body.classList.remove('has-fixed-navbar');
            document.body.style.paddingTop = '0';
        }
    }
}

// Modo oscuro persistente
function persistentDarkMode(element) {
    const isDark = element.checked;
    console.log('🌙 Modo oscuro:', isDark);
    
    applyPersistentDarkMode(isDark);
    localStorage.setItem('persistentDarkMode', isDark);
}

function applyPersistentDarkMode(isDark) {
    const body = document.body;
    if (isDark) {
        body.classList.add('dark-version');
        body.classList.remove('white-version');
    } else {
        body.classList.add('white-version');
        body.classList.remove('dark-version');
    }
}

// ===== ACTUALIZACIÓN DE UI =====

function updateConfiguratorUI(settings) {
    // Actualizar colores activos
    updateActiveColorButton(settings.sidebarColor);
    updateActiveTypeButton(settings.sidebarType);
    
    // Actualizar checkboxes
    const navbarFixed = document.getElementById('navbarFixed');
    const darkVersion = document.getElementById('dark-version');
    
    if (navbarFixed) navbarFixed.checked = settings.navbarFixed;
    if (darkVersion) darkVersion.checked = settings.darkMode;
}

function updateActiveColorButton(activeColor) {
    // Remover active de todos
    document.querySelectorAll('.badge-colors .badge').forEach(badge => {
        badge.classList.remove('active');
    });
    
    // Activar el correcto
    const activeBadge = document.querySelector(`.badge-colors .badge[data-color="${activeColor}"]`);
    if (activeBadge) {
        activeBadge.classList.add('active');
    }
}

function updateActiveTypeButton(activeType) {
    // Remover active de todos
    document.querySelectorAll('.d-flex .btn').forEach(btn => {
        btn.classList.remove('active');
    });
    
    // Activar el correcto
    const activeButton = document.querySelector(`.d-flex .btn[data-class="${activeType}"]`);
    if (activeButton) {
        activeButton.classList.add('active');
    }
}

// ===== RESET =====

function resetSettings() {
    console.log('🔄 Restableciendo configuraciones...');
    
    // Limpiar localStorage
    localStorage.removeItem('persistentSidebarColor');
    localStorage.removeItem('persistentSidebarType');
    localStorage.removeItem('persistentNavbarFixed');
    localStorage.removeItem('persistentDarkMode');
    
    // Aplicar configuraciones por defecto inmediatamente
    applyCriticalSettings(defaultSettings);
    
    // Actualizar UI
    updateConfiguratorUI(defaultSettings);
    
    // Mostrar mensaje
    alert('Configuraciones restablecidas a los valores por defecto');
}

// ===== EVENTOS ADICIONALES =====

// También cargar configuraciones cuando la página se muestra
window.addEventListener('pageshow', function() {
    initializePersistentSettings();
});

// Aplicar configuraciones también cuando la ventana se carga completamente
window.addEventListener('load', function() {
    initializePersistentSettings();
});
</script>
