{% extends "admin/change_list.html" %}
{% load i18n admin_urls static %}

{% block pagination %}
    {{ block.super }}
    

    <div style="margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 5px; border-left: 4px solid #2196F3;">
        <form method="post">
            {% csrf_token %}
            <button type="submit" name="_save"
                    style="background: #2196F3; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                💾 Guardar Todos los Cambios 
            </button>
            <span style="margin-left: 10px; color: #666;">
                Guarda todos los cambios realizados en esta página
            </span>
        </form>
    </div>
{% endblock %}
